#
# A n'utiliser que pour un site valide que le vérificateur ne sait pas tester
# (blocage des robots, certificat exotique, etc.). Les erreurs temporaires
# (timeout, 429, 5xx, SSL) ne font de toute façon pas échouer la vérification.
