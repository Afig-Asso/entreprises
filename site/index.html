<!DOCTYPE html>

<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Listing des entreprises en lien avec l'informatique graphique en France (rendu, VFX, animation, jeu vidéo, CAO, simulation, vision, XR...), maintenu par l'AFIG.">
    <title>Entreprises en informatique graphique - AFIG</title>
    <script>
        // Page integree en iframe (site de l'AFIG) : fond transparent, barre non collante
        try { if (window.self !== window.top) { document.documentElement.classList.add('embedded'); } }
        catch (e) { document.documentElement.classList.add('embedded'); }
    </script>
    <link rel="stylesheet" type="text/css" href="listing.css">
    <script src="iframeResizer/iframeResizer.contentWindow.min.js" defer></script>
    <script src="listing.js" defer></script>
</head>

<body>
    <a class="skip-link" href="#listing-summary">Aller à la liste des entreprises</a>
    <h1 class="visually-hidden">Entreprises en informatique graphique</h1>

    <div id="toolbar" class="toolbar">
        <div id="selection-listing-company">
            <div class="ux-left">
                <div class="sorting_input" role="radiogroup" aria-label="Ordre d'affichage">
                    <input type="radio" id="sort-alphabetical" name="sort" value="Alphabetical" checked>
                    <label for="sort-alphabetical">Alphabétique</label>
                    <input type="radio" id="sort-place" name="sort" value="Localization">
                    <label for="sort-place">Localité</label>
                </div>
                <div class="toggles">
                    <span class="toggle"><input type="checkbox" id="display-details" checked><label for="display-details">Détails</label></span>
                    <span class="toggle"><input type="checkbox" id="france-only"><label for="france-only">France uniquement</label></span>
                    <span class="toggle"><input type="checkbox" id="jobs-only"><label for="jobs-only">Avec offres d'emploi</label></span>
                </div>
            </div>
            <div class="ux-middle" role="search">
                <label for="search-company" class="visually-hidden">Rechercher une entreprise</label>
                <input type="search" id="search-company" class="search-input" placeholder="Rechercher (nom, ville, produit...)" autocomplete="off">
            </div>
            <div class="ux-right">
                <button type="button" id="filter-toggle" class="filter-toggle" aria-expanded="false" aria-controls="filter-panel">
                    Filtrer par thème <span class="filter-count" hidden></span>
                </button>
            </div>
        </div>

        <div id="filter-panel" class="filter-panel" hidden>
            <fieldset class="filter-group" data-domain="scientific">
                <legend>Domaine scientifique</legend>
                <button type="button" class="filter-clear" data-domain="scientific">Effacer<span class="visually-hidden"> les domaines scientifiques</span></button>
                <div class="filter-options"></div>
            </fieldset>
            <fieldset class="filter-group" data-domain="application">
                <legend>Domaine d'application</legend>
                <button type="button" class="filter-clear" data-domain="application">Effacer<span class="visually-hidden"> les domaines d'application</span></button>
                <div class="filter-options"></div>
            </fieldset>
            <p class="filter-help">Aucune case cochée : toutes les entreprises sont affichées. Plusieurs cases d'un même domaine : au moins une doit correspondre.</p>
            <div class="filter-panel-footer">
                <button type="button" id="filter-close" class="filter-close">Fermer</button>
            </div>
        </div>

        <div id="active-filters" class="active-filters" hidden></div>
    </div>

    <main id="main">
        <p id="listing-summary" class="listing-summary" role="status" tabindex="-1">Chargement de la liste des entreprises...</p>
        <div id="listing-company"></div>
    </main>
</body>

</html>
