# Simple workflow for deploying static content to GitHub Pages
name: Deploy Site

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:  write-all

# One deployment at a time, the most recent wins (an older run never overwrites a newer one)
concurrency:
  group: deploy
  cancel-in-progress: true


jobs:
  # Single deploy job since we're just deploying
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Version the scripts and styles
        # index.html and the files it loads stay in step despite the cache of GitHub Pages (10 min)
        run: sed -i -E "s/(listing\.js|graph\.js|listing\.css)\"/\1?v=${GITHUB_SHA::7}\"/g" site/index.html
      - name: Pushes to another repository
        uses: cpina/github-action-push-to-another-repository@v1.7.3
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: 'site'
          destination-github-username: 'Afig-Asso'
          destination-repository-name: 'Afig-Asso.github.io'
          user-email: association.afig@gmail.com
          user-name: 'Afig-Asso'
          target-branch: main
          target-directory: 'entreprises'
