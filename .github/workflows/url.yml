# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: URL check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # Own job (a failure here is a real problem): data.yaml is valid and json/data.json (read by the site and the map) matches it.
  # Kept apart from the url check below, whose failures (unreachable sites) are frequent and harmless.
  data:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: python -m pip install pyyaml tqdm
    - name: Regenerate and compare
      run: |
        python scripts/generate.py
        git diff --exit-code json/data.json README.md

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pyyaml tqdm
    - name: Test access urls
      run: |
        python scripts/generate.py -C
